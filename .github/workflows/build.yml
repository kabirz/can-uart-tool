name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-msvc:
    name: MSVC (Release)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: modhandler-pc-tool-msvc
          path: |
            build/Release/modhandler-pc-tool.exe
            build/loralib/Release/lora_gateway_sdk.dll

      - name: Package (release)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF -replace 'refs/tags/v', ''
          $name = "modhandler-pc-tool-v$ver"
          mkdir $name
          copy build\Release\modhandler-pc-tool.exe $name\
          copy build\loralib\Release\lora_gateway_sdk.dll $name\
          copy loralib\lora_sdk.h $name\
          copy loralib\lora_sdk_example.c $name\
          copy loralib\README.md $name\
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "package=$name.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v3.0.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.package }}
