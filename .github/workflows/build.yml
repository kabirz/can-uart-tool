name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-msvc:
    name: MSVC (Release)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Stage
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -match 'refs/tags/v(.+)$') { $matches[1] } else { git describe --tags --always }
          $dir = "modhandler-pc-tool-v$ver"
          mkdir $dir
          copy build\Release\modhandler-pc-tool.exe $dir\
          copy build\loralib\Release\lora_gateway_sdk.dll $dir\
          copy build\loralib\Release\lora_gateway_sdk.lib $dir\
          copy build\loralib\Release\lora_sdk.lib $dir\
          copy loralib\lora_sdk.h $dir\
          copy loralib\lora_sdk_example.c $dir\
          copy loralib\README.md $dir\
          "stagedir=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Upload (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.stagedir }}
          path: ${{ env.stagedir }}/*

      - name: Package and Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path $env:stagedir -DestinationPath "$env:stagedir.zip"

      - name: Release
        uses: softprops/action-gh-release@v3.0.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.stagedir }}.zip
